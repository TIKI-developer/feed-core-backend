services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # В продакшене порт наружу не пробрасываем (только внутри сети)
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - feed-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    depends_on:
      - db
    networks:
      - feed-network
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgresDbConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      AccessTokenOptions__JwtOptions__SecretKey: ${AccessTokenOptions__JwtOptions__SecretKey}
      AccessTokenOptions__JwtOptions__ExpiresHours: ${AccessTokenOptions__JwtOptions__ExpiresHours}
      EmailProviderOptions__Host: ${EmailProviderOptions__Host}
      EmailProviderOptions__Port: ${EmailProviderOptions__Port}
      EmailProviderOptions__EnableSsl: ${EmailProviderOptions__EnableSsl}
      EmailProviderOptions__Credentials__Address: ${EmailProviderOptions__Credentials__Address}
      EmailProviderOptions__Credentials__Password: ${EmailProviderOptions__Credentials__Password}
      PluginOptions__Directories__0: "/app/plugins/builtin"

volumes:
  pg_data:

networks:
  feed-network:
    driver: bridge