services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: feed
    # В продакшене порт наружу не пробрасываем (только внутри сети)
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - feed-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - feed-network
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgresDbConnection: "Host=db;Port=5432;Database=feed;Username=postgres;Password=${POSTGRES_PASSWORD}"
      AccessTokenOptions__JwtOptions__SecretKey: ${JWT_SECRET_KEY}
      AccessTokenOptions__JwtOptions__ExpiresHours: "24"
      EmailProviderOptions__Host: ${EMAIL_HOST}
      EmailProviderOptions__Port: ${EMAIL_PORT}
      EmailProviderOptions__EnableSsl: ${ENABLE_SSL}
      EmailProviderOptions__Credentials__Address: ${SENDER_ADDRESS}
      EmailProviderOptions__Credentials__Password: ${SENDER_PASSWORD}
      PluginOptions__Directories__0: "/app/plugins/builtin"

volumes:
  pg_data:

networks:
  feed-network:
    driver: bridge