services:
  # Сервис базы данных Postgres
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: feed_user
      POSTGRES_PASSWORD: feed_password_123
      POSTGRES_DB: feed_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - feed-network

  # Сервис бэкенда
  backend:
    build:
      context: ..          # Поднимаемся на уровень выше (в корень проекта)
      dockerfile: docker/Dockerfile  # Путь к Dockerfile относительно context
      target: development   # Используем development режим
    ports:
      - "8080:8080"        # Открываем порт для доступа к сайту
    volumes:
      # Монтируем папку src для hot reload
      - ../src:/repo/src
      # Эти volume'ы нужны, чтобы файлы сборки не конфликтовали
      - /repo/src/Feed.WebApi/obj
      - /repo/src/Feed.WebApi/bin
      - /repo/src/Feed.Application/obj
      - /repo/src/Feed.Application/bin
      - /repo/src/Feed.Domain/obj
      - /repo/src/Feed.Domain/bin
      - /repo/src/Feed.Persistence/obj
      - /repo/src/Feed.Persistence/bin
      - /repo/src/Feed.Security/obj
      - /repo/src/Feed.Security/bin
      - /repo/src/Feed.Shared/obj
      - /repo/src/Feed.Shared/bin
    depends_on:
      - db
    networks:
      - feed-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Строка подключения к БД (используем имя сервиса "db")
      - ConnectionStrings__DbConnection=Server=db;Port=5432;Database=feed_db;Username=feed_user;Password=feed_password_123;

# Тома для хранения данных
volumes:
  pg_data:

# Сеть для общения контейнеров
networks:
  feed-network:
    driver: bridge