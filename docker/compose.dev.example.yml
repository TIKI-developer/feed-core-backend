services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YOUR_POSTGRES_PASSWORD
      POSTGRES_DB: feed
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - feed-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    ports:
      - "8080:8080"
    volumes:
      - ../src:/repo/src
      - /repo/src/Feed.WebApi/obj
      - /repo/src/Feed.WebApi/bin
      - /repo/src/Feed.Application/obj
      - /repo/src/Feed.Application/bin
      - /repo/src/Feed.Domain/obj
      - /repo/src/Feed.Domain/bin
      - /repo/src/Feed.Persistence/obj
      - /repo/src/Feed.Persistence/bin
      - /repo/src/Feed.Security/obj
      - /repo/src/Feed.Security/bin
      - /repo/src/Feed.Shared/obj
      - /repo/src/Feed.Shared/bin
      - /repo/src/Feed.Email/obj
      - /repo/src/Feed.Email/bin
    depends_on:
      - db
    networks:
      - feed-network
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: true
      
      # ALL VARIABLES SHOULD BE REPLACED WITH YOUR OWN VALUES
      ConnectionStrings__PostgresDbConnection: "Host=db;Port=5432;Database=feed;Username=postgres;Password=YOUR_POSTGRES_PASSWORD"
      
      AccessTokenOptions__JwtOptions__SecretKey: "YOUR_JWT_SECRET_KEY"
      AccessTokenOptions__JwtOptions__ExpiresHours: "24"
      
      EmailProviderOptions__Host: "EMAIL_HOST"
      EmailProviderOptions__Port: "EMAIL_PORT"
      EmailProviderOptions__EnableSsl: "true"
      EmailProviderOptions__Credentials__Address: "SENDER_ADDRESS"
      EmailProviderOptions__Credentials__Password: "SENDER_PASSWORD"


volumes:
  pg_data:

networks:
  feed-network:
    driver: bridge
