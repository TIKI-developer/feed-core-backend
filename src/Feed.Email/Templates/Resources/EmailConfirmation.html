<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Подтверждение почты</title>
  </head>
  <body>
    <div
      style="
        padding: 25px;
        font-family: 'Inter', serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        text-align: center;
      "
    >
      <div
        style="
          margin: auto;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 15px;
          width: 400px;
        "
      >
        <div>
          <h1 style="margin: 5px; font-size: 25px">Подтверждение почты</h1>
        </div>
        <div>
          <p>
            Необходимо подтвердить почту
          </p>
        </div>
        <a
          style="
            display: inline-block;
            background-color: #3a72ec;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            vertical-align: middle;
            line-height: 40px;
            height: 40px;
            width: 250px;
            text-align: center;
          "
          href="{{ConfirmationUrl}}"
        >
          Подтвердить почту
        </a>
        <div>
            <i style="font-size: 13px; color: red">
                Если вы не отправляли этот запрос, <br />
                смените пароль и обратитесь в поддержку
            </i>
        </div>
      </div>
    </div>
  </body>
</html>
